<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de gastos</title>
<style>
  :root {
    --bg: #f4f5f9; --card: #fff; --text: #1d2130; --muted: #6b7080; --line: #e4e6ee;
    --accent: #4458d8; --accent-soft: #e9ecfc; --danger: #d24b4b; --ok: #2f8a5e;
    --tip-bg: #fff7e3; --tip-line: #f2dc9e;
    --radius: 16px; --shadow: 0 1px 2px rgba(20, 25, 45, .05), 0 6px 20px rgba(20, 25, 45, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1117; --card: #181b24; --text: #e6e8ef; --muted: #979db0; --line: #2a2e3b;
            --accent: #8193ff; --accent-soft: #232a4d; --ok: #4cc38a; --tip-bg: #2a2414; --tip-line: #5c4a1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 32px 16px 48px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.75rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat small { color: var(--muted); }
  .stat strong { display: block; font-size: 1.6rem; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .negativo { color: var(--danger); }
  .barra { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 16px; }
  .barra span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .3s; }
  .barra.estourou span { background: var(--danger); }
  input, select { width: 100%; min-width: 0; padding: 12px 14px; font: inherit; color: inherit; background: var(--bg);
                  border: 1px solid var(--line); border-radius: 12px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { padding: 12px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn.sec { color: var(--accent); background: var(--accent-soft); }
  .orc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .orc label { flex: 1 0 100%; color: var(--muted); font-size: .9rem; }
  .orc input { flex: 1; width: auto; }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grade #descricao, .grade .btn { grid-column: 1 / -1; }
  #msg { color: var(--danger); font-size: .9rem; margin: 8px 0 0; }
  #msg:empty, #dica:empty { display: none; }
  #dica { background: var(--tip-bg); border: 1px solid var(--tip-line); border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 0; }
  li .desc { flex: 1; min-width: 0; }
  li .desc small { display: block; color: var(--muted); font-size: .85rem; }
  li .valor { font-weight: 600; font-variant-numeric: tabular-nums; }
  .remover { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; }
  .remover:hover, .remover:focus-visible { background: #d24b4b1a; color: var(--danger); }
  .vazio { color: var(--muted); justify-content: center; }
  #resumo { white-space: pre-wrap; margin: 0; }
  @media (max-width: 420px) { .stats { gap: 12px; } .stat strong { font-size: 1.3rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Controle de gastos</h1>
    <p class="sub" id="titulo-mes"></p>
  </header>

  <section class="stats">
    <div class="card stat"><small>Gasto no mês</small><strong id="total">R$ 0,00</strong></div>
    <div class="card stat"><small>Sobra</small><strong id="sobra">—</strong></div>
  </section>

  <section class="card">
    <form id="form-orcamento" class="orc">
      <label for="orcamento">Orçamento do mês (R$)</label>
      <input id="orcamento" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Ex.: 3000">
      <button class="btn sec">Salvar</button>
    </form>
    <div class="barra" id="barra" hidden><span></span></div>
  </section>

  <p id="dica" role="status"></p>

  <section class="card">
    <h2>Novo gasto</h2>
    <form id="form-gasto" class="grade">
      <input id="descricao" type="text" placeholder="Descrição, ex.: mercado" maxlength="80" aria-label="Descrição" required>
      <input id="valor" type="number" min="0.01" step="0.01" placeholder="Valor (R$)" aria-label="Valor em reais" inputmode="decimal" required>
      <select id="categoria" aria-label="Categoria"></select>
      <button class="btn">Registrar gasto</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section class="card">
    <h2>Gastos do mês</h2>
    <ul id="lista"></ul>
  </section>

  <section class="card">
    <h2>Resumo do mês</h2>
    <p id="resumo"></p>
  </section>
</main>

<script>
const CATEGORIAS = ["Alimentação", "Transporte", "Lazer", "Contas", "Outros"];
const DICAS = {
  "Alimentação": "planeje o cardápio da semana, vá ao mercado com lista e troque delivery por marmita alguns dias.",
  "Transporte": "junte trajetos no mesmo dia, compare aplicativo com transporte público e mantenha os pneus calibrados.",
  "Lazer": "defina um valor fixo por semana para lazer e alterne com programas gratuitos.",
  "Contas": "revise assinaturas e planos (celular, internet, streaming) e cancele o que pouco usa.",
  "Outros": "anote melhor o que cai em \"Outros\": gasto sem categoria costuma ser compra por impulso.",
};
const CHAVE_ORC = "gastos_orcamento";
const CHAVE_LISTA = "gastos_lista";

// Valores guardados em centavos (inteiros): somar 0.1 + 0.2 em reais dá erro de arredondamento.
const brl = c => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const chaveMes = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

function ler(chave, padrao) {
  try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; }
}
let orcamento = ler(CHAVE_ORC, 0);
if (!Number.isFinite(orcamento) || orcamento < 0) orcamento = 0;
let gastos = ler(CHAVE_LISTA, []);
if (!Array.isArray(gastos)) gastos = [];
gastos = gastos.filter(g => g && Number.isFinite(g.valor) && g.valor > 0 && typeof g.mes === "string");

const msg = document.getElementById("msg");

function salvar() {
  try {
    localStorage.setItem(CHAVE_ORC, JSON.stringify(orcamento));
    localStorage.setItem(CHAVE_LISTA, JSON.stringify(gastos));
  } catch {
    msg.textContent = "Não consegui salvar no navegador (armazenamento cheio ou bloqueado).";
  }
}

// O orçamento é mensal: só os gastos do mês atual contam.
const doMes = () => gastos.filter(g => g.mes === chaveMes(new Date()));

function porCategoria(lista) {
  const soma = Object.fromEntries(CATEGORIAS.map(c => [c, 0]));
  for (const g of lista) soma[CATEGORIAS.includes(g.categoria) ? g.categoria : "Outros"] += g.valor;
  return Object.entries(soma).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
}

function dica(total, cats) {
  if (!total) return "Nenhum gasto registrado neste mês.";
  if (orcamento && total > orcamento) return `Atenção: você passou ${brl(total - orcamento)} do orçamento.`;
  const [cat, valor] = cats[0];
  return `${cat} é a categoria que mais pesa: ${Math.round(valor / total * 100)}% do total.`;
}

// Resumo em português gerado aqui mesmo, sem IA paga.
function resumo(lista, total, cats) {
  if (!lista.length) return "Registre gastos para ver o resumo do mês.";
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diasRestantes = ultimoDia - hoje.getDate() + 1;
  const linhas = [];

  if (orcamento) {
    linhas.push(`Você gastou ${brl(total)} de ${brl(orcamento)} (${Math.round(total / orcamento * 100)}% do orçamento).`);
    const sobra = orcamento - total;
    linhas.push(sobra >= 0
      ? `Faltam ${diasRestantes} dia(s) para o mês acabar: dá para gastar até ${brl(Math.floor(sobra / diasRestantes))} por dia.`
      : `Você já passou ${brl(-sobra)} do orçamento. Tente não gastar nada que não seja essencial até o fim do mês.`);
  } else {
    linhas.push(`Você gastou ${brl(total)} neste mês. Defina um orçamento para acompanhar quanto sobra.`);
  }

  linhas.push("", "Para onde foi o dinheiro:");
  for (const [cat, v] of cats) linhas.push(`• ${cat}: ${brl(v)} (${Math.round(v / total * 100)}%)`);

  const maior = lista.reduce((a, b) => (b.valor > a.valor ? b : a));
  linhas.push("", `Maior gasto: ${maior.descricao} (${brl(maior.valor)}).`);

  linhas.push("", "Como economizar:");
  for (const [cat, v] of cats.slice(0, 2)) {
    linhas.push(`• ${cat}: ${DICAS[cat]} Cortar 15% aqui economiza cerca de ${brl(Math.round(v * 0.15))} por mês.`);
  }
  return linhas.join("\n");
}

function render() {
  const lista = doMes();
  const total = lista.reduce((s, g) => s + g.valor, 0);
  const cats = porCategoria(lista);

  document.getElementById("orcamento").value = orcamento ? (orcamento / 100).toFixed(2) : "";
  document.getElementById("total").textContent = brl(total);
  const sobraEl = document.getElementById("sobra");
  if (orcamento) {
    const sobra = orcamento - total;
    sobraEl.textContent = brl(sobra);
    sobraEl.classList.toggle("negativo", sobra < 0);
  } else {
    sobraEl.textContent = "Defina o orçamento";
    sobraEl.classList.remove("negativo");
  }
  document.getElementById("dica").textContent = dica(total, cats);
  const mes = new Date().toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  document.getElementById("titulo-mes").textContent = mes.charAt(0).toUpperCase() + mes.slice(1);
  const barra = document.getElementById("barra");
  barra.hidden = !orcamento;
  barra.classList.toggle("estourou", total > orcamento);
  barra.firstElementChild.style.width = orcamento ? Math.min(100, total / orcamento * 100) + "%" : "0";

  const ul = document.getElementById("lista");
  ul.replaceChildren();
  if (!lista.length) {
    const li = document.createElement("li");
    li.className = "vazio";
    li.textContent = "Nenhum gasto ainda.";
    ul.append(li);
  }
  for (const g of [...lista].reverse()) {
    const li = document.createElement("li");
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = g.descricao;
    const info = document.createElement("small");
    info.textContent = `${g.categoria} · ${g.data}`;
    desc.append(info);
    const val = document.createElement("span");
    val.className = "valor";
    val.textContent = brl(g.valor);
    const x = document.createElement("button");
    x.className = "remover";
    x.textContent = "×";
    x.setAttribute("aria-label", `Remover ${g.descricao}`);
    // Remove pelo id, não pela posição: a lista aparece invertida e filtrada pelo mês.
    x.addEventListener("click", () => { gastos = gastos.filter(o => o.id !== g.id); salvar(); render(); });
    li.append(desc, val, x);
    ul.append(li);
  }

  document.getElementById("resumo").textContent = resumo(lista, total, cats);
}

const sel = document.getElementById("categoria");
for (const c of CATEGORIAS) sel.add(new Option(c, c));

document.getElementById("form-orcamento").addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("orcamento").valueAsNumber;
  orcamento = Number.isFinite(v) && v > 0 ? Math.round(v * 100) : 0;
  salvar(); render();
});

document.getElementById("form-gasto").addEventListener("submit", e => {
  e.preventDefault();
  const descricao = document.getElementById("descricao").value.trim().replace(/\s+/g, " ");
  const valor = Math.round(document.getElementById("valor").valueAsNumber * 100);
  if (!descricao) { msg.textContent = "Digite uma descrição."; return; }
  if (!Number.isFinite(valor) || valor <= 0) { msg.textContent = "Digite um valor maior que zero."; return; }
  const agora = new Date();
  gastos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    descricao, valor, categoria: sel.value,
    mes: chaveMes(agora), data: agora.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }),
  });
  msg.textContent = "";
  salvar(); render();
  e.target.reset();
  document.getElementById("descricao").focus();
});

render();
</script>
</body>
</html>
